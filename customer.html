<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>پنل کاربری</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --surface: #111;
  --surface2: #161616;
  --border: #1e1e1e;
  --text: #f5f5f5;
  --text2: #a0a0a0;
  --text3: #666;
  --accent: #fff;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --amber: #f59e0b;
  --r: 16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);direction:rtl;
  min-height:100vh;overflow-x:hidden;
  padding-bottom:calc(80px + env(safe-area-inset-bottom,16px));
  line-height:1.5;
}

/* header */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.header h1{font-size:18px;font-weight:600;letter-spacing:-.3px}
.header .badge{
  font-size:12px;padding:4px 10px;border-radius:100px;
  background:var(--surface2);color:var(--text2);border:1px solid var(--border);
}

/* page */
.page{display:none;padding:16px 16px 24px;animation:fadeIn .2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* cards */
.card{
  background:var(--surface);border-radius:var(--r);padding:20px;
  border:1px solid var(--border);margin-bottom:12px;
}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-header .icon{
  width:32px;height:32px;border-radius:8px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.card-header h3{font-size:14px;font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;text-align:center;
}
.stat .num{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1}
.stat .lbl{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* order card */
.order{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;
}
.order:active{border-color:var(--text3)}
.order .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.order .id{font-weight:600;font-size:14px}
.order .status{
  font-size:10px;padding:3px 8px;border-radius:100px;font-weight:600;
  letter-spacing:.3px;text-transform:uppercase;
}
.status-pending{background:rgba(245,158,11,.1);color:var(--amber)}
.status-paid_advance,.status-in_progress{background:rgba(59,130,246,.1);color:var(--blue)}
.status-completed{background:rgba(34,197,94,.1);color:var(--green)}
.status-paid_final{background:rgba(34,197,94,.15);color:var(--green)}
.status-cancelled{background:rgba(239,68,68,.1);color:var(--red)}
.order .cat{font-size:12px;color:var(--text3);margin-bottom:4px}
.order .desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.order .meta{display:flex;gap:12px;font-size:11px;color:var(--text3)}
.order .price{font-weight:600;color:var(--text)}

/* detail */
.detail-block{margin-bottom:20px}
.detail-block h3{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.detail-row{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--border);font-size:13px}
.detail-row .key{color:var(--text3)}
.detail-row .val{color:var(--text);font-weight:500;text-align:left}
.file-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:var(--surface2);border-radius:10px;margin-bottom:4px;font-size:12px;
}

/* buttons */
.btn{
  display:block;width:100%;padding:14px;border-radius:12px;font-size:14px;font-weight:600;
  text-align:center;cursor:pointer;border:none;font-family:inherit;
  transition:opacity .15s,transform .15s;
}
.btn:active{transform:scale(.98);opacity:.9}
.btn-primary{background:var(--accent);color:#000}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.15)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:8px 14px;font-size:12px;border-radius:8px;width:auto;display:inline-block}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}

/* input */
.input{
  width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none;
  transition:border-color .2s;
}
.input:focus{border-color:var(--accent)}
.textarea{resize:vertical;min-height:100px;line-height:1.6}
.label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}
.form-group{margin-bottom:14px}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,10,10,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);
  border-top:1px solid var(--border);z-index:100;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:4px 12px;cursor:pointer;color:var(--text3);font-size:10px;
  font-weight:500;border:none;background:none;font-family:inherit;transition:color .15s;
}
.nav-item.active{color:var(--text)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}

/* empty */
.empty{text-align:center;padding:40px 20px}
.empty .icon{font-size:40px;margin-bottom:12px;opacity:.3}
.empty p{font-size:14px;color:var(--text3)}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;
  align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{
  background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:500px;
  max-height:85vh;overflow-y:auto;padding:8px 0;animation:slideUp .3s ease;
  border:1px solid var(--border);border-bottom:none;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:100px;margin:8px auto 16px}
.modal-body{padding:0 20px 24px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:16px;text-align:center}

/* category select */
.cat-option{
  background:var(--surface2);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;
}
.cat-option:active,.cat-option.selected{border-color:var(--accent)}
.cat-option .row{display:flex;justify-content:space-between;align-items:center}
.cat-option .name{font-weight:600;font-size:14px}
.cat-option .price{font-size:13px;color:var(--text2)}
.cat-option .desc{font-size:11px;color:var(--text3);margin-top:4px}

/* toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:var(--surface);color:var(--text);padding:12px 24px;
  border-radius:12px;font-size:13px;font-weight:500;z-index:2000;
  border:1px solid var(--border);animation:toastIn .3s ease,toastOut .3s ease 1.8s forwards;
}
.toast.error{border-color:rgba(239,68,68,.3);color:var(--red)}
.toast.success{border-color:rgba(34,197,94,.3);color:var(--green)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(-50%) translateY(-12px)}}

/* pills */
.pill{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:100px;font-size:11px;font-weight:500;border:1px solid var(--border);
  background:var(--surface2);
}

/* copy button */
.copy-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--text2);
  padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.copy-btn:active{background:var(--border)}

/* wallet balance highlight */
.balance-large{
  font-size:42px;font-weight:800;letter-spacing:-2px;text-align:center;
  margin:8px 0;line-height:1;
}

/* filter tabs */
.filters{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:0 0 16px;-ms-overflow-style:none;
}
.filters::-webkit-scrollbar{display:none}
.filter{
  padding:8px 14px;border-radius:100px;font-size:12px;font-weight:500;
  white-space:nowrap;cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-family:inherit;
  transition:all .15s;flex-shrink:0;
}
.filter.active{background:var(--accent);color:#000;border-color:var(--accent)}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <h1 id="pageTitle">داشبورد</h1>
  <span class="badge" id="headerBadge" style="display:none"></span>
</header>

<!-- PAGES -->
<div class="page active" id="page-dashboard">
  <div class="stats" id="dashStats"></div>
  <div class="card">
    <div class="card-header"><div class="icon">◉</div><h3>آخرین سفارشات</h3></div>
    <div id="recentOrders"></div>
  </div>
</div>

<div class="page" id="page-new-order">
  <div class="card">
    <div class="card-header"><div class="icon">＋</div><h3>انتخاب دسته‌بندی</h3></div>
    <div id="catList"></div>
  </div>
  <div class="card" id="descCard" style="display:none">
    <div class="card-header"><div class="icon">✎</div><h3>توضیحات پروژه</h3></div>
    <div class="form-group">
      <label class="label">توضیحات کامل</label>
      <textarea class="input textarea" id="orderDesc" placeholder="موضوع، deadline، فرمت و هر نکته مهم دیگر..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="submitOrder()">ثبت سفارش</button>
  </div>
</div>

<div class="page" id="page-orders">
  <div class="filters" id="orderFilters"></div>
  <div id="ordersList"></div>
</div>

<div class="page" id="page-order-detail">
  <button class="btn btn-outline btn-sm" onclick="navTo('orders')" style="margin-bottom:16px">← بازگشت</button>
  <div id="orderDetail"></div>
</div>

<div class="page" id="page-wallet">
  <div class="card" style="text-align:center">
    <div class="balance-large" id="walBalance">0</div>
    <div style="color:var(--text3);font-size:13px">تومان</div>
  </div>
  <div class="card">
    <div class="card-header"><div class="icon">↕</div><h3>تراکنش‌ها</h3></div>
    <div id="walTxns"></div>
  </div>
</div>

<div class="page" id="page-club">
  <div class="card" style="text-align:center">
    <div style="font-size:12px;color:var(--text3);margin-bottom:4px">کد معرف شما</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px">
      <code style="font-size:22px;font-weight:700;letter-spacing:2px;background:var(--surface2);padding:8px 16px;border-radius:10px" id="refCode">---</code>
      <button class="copy-btn" onclick="copyRef()">کپی</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num" id="refCount">0</div><div class="lbl">دعوت شده</div></div>
    <div class="stat"><div class="num" id="refEarned">0</div><div class="lbl">پاداش (تومان)</div></div>
  </div>
  <div class="card">
    <div class="card-header"><div class="icon">✓</div><h3>اعمال کد معرف</h3></div>
    <div class="form-group">
      <label class="label">کد معرف را وارد کنید</label>
      <div style="display:flex;gap:8px">
        <input class="input" id="applyRefCode" placeholder="مثلاً REF123ABC" style="text-transform:uppercase">
        <button class="btn btn-primary" style="width:auto;white-space:nowrap" onclick="applyRef()">اعمال</button>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="dashboard" onclick="navTo('dashboard')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>داشبورد</span>
  </button>
  <button class="nav-item" data-page="new-order" onclick="navTo('new-order')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>سفارش جدید</span>
  </button>
  <button class="nav-item" data-page="orders" onclick="navTo('orders')">
    <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="12" y2="15"/></svg>
    <span>سفارشات</span>
  </button>
  <button class="nav-item" data-page="wallet" onclick="navTo('wallet')">
    <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><line x1="16" y1="12" x2="20" y2="12"/></svg>
    <span>کیف پول</span>
  </button>
  <button class="nav-item" data-page="club" onclick="navTo('club')">
    <svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><path d="M2 21c0-3.3 2.7-6 6-6h2c3.3 0 6 2.7 6 6"/><path d="M14 21c0-3.3 2.7-6 6-6"/></svg>
    <span>باشگاه</span>
  </button>
</nav>

<!-- TOAST -->
<div id="toastContainer"></div>

<script>
const TG = window.Telegram.WebApp; TG.ready(); TG.expand();
const initData = TG.initData || '';
const API = (path, method='GET', body=null) => {
  const opts = {method, headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData}};
  if (body) opts.body = JSON.stringify(body);
  return fetch(path, opts).then(r => r.ok ? r.json() : r.json().then(e => {throw new Error(e.error||'خطا')}));
};

// ── state ──
let currentPage = 'dashboard';
let currentFilter = 'all';
let categories = [];
let orders = [];
let selectedCat = null;

// ── navigation ──
function navTo(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const pg = document.getElementById('page-'+page);
  if (pg) pg.classList.add('active');
  const nav = document.querySelector(`.nav-item[data-page="${page}"]`);
  if (nav) nav.classList.add('active');

  const titles = {dashboard:'داشبورد','new-order':'سفارش جدید',orders:'سفارشات',wallet:'کیف پول',club:'باشگاه مشتریان'};
  document.getElementById('pageTitle').textContent = titles[page] || '';

  if (page === 'dashboard') loadDashboard();
  if (page === 'new-order') loadCategories();
  if (page === 'orders') loadOrders();
  if (page === 'wallet') loadWallet();
  if (page === 'club') loadClub();
  if (page !== 'order-detail') document.getElementById('page-order-detail').classList.remove('active');
}

// ── toast ──
function toast(msg, type='') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast '+type; t.textContent = msg; c.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ── dashboard ──
async function loadDashboard() {
  try {
    const d = await API('/api/customer/dashboard');
    document.getElementById('dashStats').innerHTML = `
      <div class="stat"><div class="num">${d.orders_count}</div><div class="lbl">کل سفارشات</div></div>
      <div class="stat"><div class="num">${d.active_orders}</div><div class="lbl">در حال انجام</div></div>
      <div class="stat"><div class="num">${d.completed_orders}</div><div class="lbl">تکمیل شده</div></div>
      <div class="stat"><div class="num">${d.wallet_balance.toLocaleString('fa-IR')}</div><div class="lbl">موجودی (تومان)</div></div>`;
    await loadOrders();
    const recent = orders.slice(0, 4);
    document.getElementById('recentOrders').innerHTML = recent.length
      ? recent.map(o => renderOrderCard(o)).join('')
      : '<div class="empty"><div class="icon">○</div><p>سفارشی ثبت نشده</p></div>';
    attachOrderClicks();
  } catch(e) { toast(e.message, 'error'); }
}

// ── categories ──
async function loadCategories() {
  selectedCat = null;
  document.getElementById('descCard').style.display = 'none';
  try {
    categories = await API('/api/customer/categories');
    document.getElementById('catList').innerHTML = categories.map(c => `
      <div class="cat-option" onclick="selectCat('${c.id}')" id="cat-${c.id}">
        <div class="row"><span class="name">${esc(c.name)}</span><span class="price">${c.price.toLocaleString('fa-IR')} تومان</span></div>
        <div class="desc">${esc(c.description||'')} · پیش‌پرداخت ${c.advance_percent}٪</div>
      </div>`).join('');
  } catch(e) { toast(e.message, 'error'); }
}

function selectCat(cid) {
  selectedCat = cid;
  document.querySelectorAll('.cat-option').forEach(el => el.classList.remove('selected'));
  document.getElementById('cat-'+cid)?.classList.add('selected');
  document.getElementById('descCard').style.display = 'block';
  document.getElementById('descCard').scrollIntoView({behavior:'smooth'});
}

async function submitOrder() {
  if (!selectedCat) { toast('دسته‌بندی را انتخاب کنید', 'error'); return; }
  const desc = document.getElementById('orderDesc').value.trim();
  if (!desc) { toast('توضیحات را وارد کنید', 'error'); return; }
  try {
    const o = await API('/api/customer/orders', 'POST', {category_id: selectedCat, description: desc});
    toast('✅ سفارش با موفقیت ثبت شد!', 'success');
    document.getElementById('orderDesc').value = '';
    document.getElementById('descCard').style.display = 'none';
    selectedCat = null;
    document.querySelectorAll('.cat-option').forEach(el => el.classList.remove('selected'));
    // Go back to orders
    setTimeout(() => navTo('dashboard'), 1000);
  } catch(e) { toast(e.message, 'error'); }
}

// ── orders ──
async function loadOrders() {
  try {
    orders = await API('/api/customer/orders');
    renderOrders();
    setupFilters();
  } catch(e) { toast(e.message, 'error'); }
}

function setupFilters() {
  const statuses = [...new Set(orders.map(o => o.status))];
  const labels = {pending:'در انتظار',paid_advance:'در حال انجام',in_progress:'در حال انجام',completed:'تکمیل',paid_final:'تسویه',cancelled:'لغو'};
  document.getElementById('orderFilters').innerHTML = `
    <button class="filter active" onclick="filterOrders('all',this)">همه</button>
    ${statuses.map(s => `<button class="filter" onclick="filterOrders('${s}',this)">${labels[s]||s}</button>`).join('')}`;
}

function filterOrders(status, btn) {
  currentFilter = status;
  document.querySelectorAll('.filter').forEach(f => f.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);
  const c = document.getElementById('ordersList');
  if (!filtered.length) { c.innerHTML = '<div class="empty"><div class="icon">○</div><p>سفارشی یافت نشد</p></div>'; return; }
  c.innerHTML = filtered.map(o => renderOrderCard(o)).join('');
  attachOrderClicks();
}

const statusLabels = {pending:'در انتظار',paid_advance:'پیش‌پرداخت',in_progress:'در حال انجام',completed:'تکمیل',paid_final:'تسویه',cancelled:'لغو'};

function renderOrderCard(o) {
  return `<div class="order" data-oid="${o.id}">
    <div class="top"><span class="id">#${o.id}</span><span class="status status-${o.status}">${statusLabels[o.status]||o.status}</span></div>
    <div class="cat">${esc(o.category_name)}</div>
    <div class="desc">${esc(o.description||'')}</div>
    <div class="meta"><span>${o.price.toLocaleString('fa-IR')} تومان</span><span>${new Date(o.created_at).toLocaleDateString('fa-IR')}</span></div>
  </div>`;
}

function attachOrderClicks() {
  document.querySelectorAll('.order').forEach(el => {
    el.addEventListener('click', () => openOrder(el.dataset.oid));
  });
}

async function openOrder(oid) {
  try {
    const o = await API('/api/customer/orders/'+oid);
    const files = o.files || [];
    const payments = o.payments || [];
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-order-detail').classList.add('active');
    document.getElementById('pageTitle').textContent = 'سفارش #'+oid;

    let html = `<div class="detail-block"><h3>اطلاعات سفارش</h3>
      <div class="detail-row"><span class="key">وضعیت</span><span class="val"><span class="status status-${o.status}">${statusLabels[o.status]||o.status}</span></span></div>
      <div class="detail-row"><span class="key">دسته‌بندی</span><span class="val">${esc(o.category_name)}</span></div>
      <div class="detail-row"><span class="key">قیمت</span><span class="val">${o.price.toLocaleString('fa-IR')} تومان</span></div>
      <div class="detail-row"><span class="key">پیش‌پرداخت</span><span class="val">${o.advance_amount.toLocaleString('fa-IR')} تومان</span></div>
      <div class="detail-row"><span class="key">پرداخت نهایی</span><span class="val">${o.final_amount.toLocaleString('fa-IR')} تومان</span></div>
      <div class="detail-row"><span class="key">تاریخ</span><span class="val">${new Date(o.created_at).toLocaleDateString('fa-IR')}</span></div>
    </div>`;

    if (o.description) {
      html += `<div class="detail-block"><h3>توضیحات</h3><div style="font-size:13px;line-height:1.7;white-space:pre-wrap">${esc(o.description)}</div></div>`;
    }

    if (files.length) {
      html += `<div class="detail-block"><h3>فایل‌ها (${files.length})</h3>${files.map(f => `<div class="file-item"><span>◈</span><span>${esc(f.filename)}</span></div>`).join('')}</div>`;
    }

    if (payments.length) {
      html += `<div class="detail-block"><h3>پرداخت‌ها</h3>${payments.map(p => {
        const ps = p.status==='paid'?'پرداخت شده':p.status==='failed'?'ناموفق':'در انتظار';
        const pc = p.status==='paid'?'color:var(--green)':p.status==='failed'?'color:var(--red)':'color:var(--amber)';
        return `<div class="detail-row"><span class="key">${p.payment_type==='advance'?'پیش‌پرداخت':'نهایی'}</span><span class="val" style="${pc}">${p.amount.toLocaleString('fa-IR')} تومان — ${ps}</span></div>`;
      }).join('')}</div>`;
    }

    // Payment button
    if (o.status === 'pending') {
      html += `<button class="btn btn-primary" onclick="createPayment('${o.id}','advance')">پرداخت پیش‌پرداخت (${o.advance_amount.toLocaleString('fa-IR')} تومان)</button>`;
    } else if (o.status === 'completed') {
      html += `<button class="btn btn-primary" onclick="createPayment('${o.id}','final')">پرداخت نهایی (${o.final_amount.toLocaleString('fa-IR')} تومان)</button>`;
    }

    if (!o.referral_discount_applied && (o.status === 'pending')) {
      html += `<div class="form-group" style="margin-top:12px"><label class="label">کد معرف (برای تخفیف)</label>
        <div style="display:flex;gap:8px"><input class="input" id="refInput_${oid}" placeholder="کد معرف"><button class="btn btn-secondary btn-sm" onclick="applyRefToOrder('${oid}')">اعمال</button></div></div>`;
    }

    document.getElementById('orderDetail').innerHTML = html;
    document.getElementById('page-order-detail').classList.add('active');
    window.scrollTo(0,0);
  } catch(e) { toast(e.message, 'error'); }
}

async function createPayment(oid, type) {
  try {
    const r = await API('/api/customer/payments', 'POST', {order_id: oid, type});
    if (r.payment_url) {
      TG.openLink(r.payment_url);
    }
  } catch(e) { toast(e.message, 'error'); }
}

async function applyRefToOrder(oid) {
  const code = document.getElementById('refInput_'+oid)?.value?.trim();
  if (!code) { toast('کد معرف را وارد کنید', 'error'); return; }
  try {
    const r = await API('/api/customer/orders/'+oid+'/ref_code', 'POST', {code});
    toast('✅ کد معرف اعمال شد!', 'success');
    openOrder(oid);
  } catch(e) { toast(e.message, 'error'); }
}

// ── wallet ──
async function loadWallet() {
  try {
    const d = await API('/api/customer/wallet');
    document.getElementById('walBalance').textContent = (d.wallet?.balance||0).toLocaleString('fa-IR');
    const txns = (d.wallet?.transactions||[]).slice(-10).reverse();
    document.getElementById('walTxns').innerHTML = txns.length
      ? txns.map(t => `<div class="detail-row"><span class="key">${esc(t.description||'')}</span><span class="val" style="color:${t.type==='credit'?'var(--green)':'var(--red)'}">${t.type==='credit'?'+':'-'}${t.amount.toLocaleString('fa-IR')}</span></div>`).join('')
      : '<div class="empty"><p style="font-size:13px">تراکنشی ثبت نشده</p></div>';
  } catch(e) { toast(e.message, 'error'); }
}

// ── club ──
async function loadClub() {
  try {
    const d = await API('/api/customer/wallet');
    const ref = d.referral;
    document.getElementById('refCode').textContent = ref?.code || '---';
    document.getElementById('refCount').textContent = ref?.invited_count || 0;
    document.getElementById('refEarned').textContent = (ref?.total_earned||0).toLocaleString('fa-IR');
  } catch(e) { toast(e.message, 'error'); }
}

function copyRef() {
  const code = document.getElementById('refCode').textContent;
  if (code && code !== '---') {
    navigator.clipboard.writeText(code).then(() => toast('کپی شد!', 'success')).catch(() => toast('خطا در کپی', 'error'));
  }
}

async function applyRef() {
  const code = document.getElementById('applyRefCode').value.trim().toUpperCase();
  if (!code) { toast('کد معرف را وارد کنید', 'error'); return; }
  try {
    const r = await API('/api/customer/referral/apply', 'POST', {code});
    toast(r.message, 'success');
    loadClub();
  } catch(e) { toast(e.message, 'error'); }
}

// ── utils ──
function esc(s) { 
  if (!s) return ''; 
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML; 
}

// ── init ──
loadDashboard();

// Open specific order from URL
const urlOrder = new URLSearchParams(window.location.search).get('order');
if (urlOrder) { setTimeout(() => openOrder(urlOrder), 500); }

document.addEventListener('click', e => {
  if (e.target.closest('button') || e.target.closest('.order') || e.target.closest('.cat-option')) {
    TG.HapticFeedback?.impactOccurred('light');
  }
});
</script>
